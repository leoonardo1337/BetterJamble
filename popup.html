<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>BetterJamble</title>
<style>
  /* popup — no visual do BetterJamble Panel (true-black-flat) */
  :root{color-scheme:dark}
  body{margin:0;width:300px;background:#000;color:#fff;font:400 13.5px/1.45 "Inter","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  header{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
  .marca-gema{width:22px;height:22px;flex:none}
  .marca-gema path{fill:none;stroke:#4cb3f0;stroke-width:1.4;stroke-linejoin:round}
  h1{margin:0;font-size:15px;font-weight:600}
  .sub{color:#949494;font-size:12px;margin-top:1px}
  .acts{display:flex;flex-direction:column;gap:6px;padding:4px 12px 14px}
  button{width:100%;height:44px;padding:0 14px;border-radius:12px;border:0;background:#111;color:#fff;
    font:500 13.5px "Inter","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;transition:background .16s}
  button:hover{background:#222}
  button.primary{background:#fff;color:#000;font-weight:600}
  button.primary:hover{background:#fff}
  .ico{font-size:14px;width:18px;text-align:center}
  /* atualização: versão atual e o resultado da conferência */
  .atual{border-top:1px solid #1f1f1f;padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px}
  .atual-linha{display:flex;align-items:center;justify-content:space-between;color:#949494;font-size:12px;padding:0 4px}
  .atual-linha b{color:#fff;font-weight:600}
  #statusAtualizacao{color:#b4b4b4;font-size:12px;padding:0 4px;min-height:1em}
  #statusAtualizacao.ok{color:#3fc07a}
  #aplicar{background:#3fc07a;color:#000;font-weight:600}
  #aplicar:hover{background:#56d08c}
  button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
  <header>
    <svg class="marca-gema" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3h8l3.5 4.5L10 17 2.5 7.5z"/><path d="M2.5 7.5h15M7.5 3 6 7.5l4 9.5 4-9.5L12.5 3"/></svg>
    <div><h1>BetterJamble</h1><div class="sub" id="quando">carregando…</div></div>
  </header>
  <div class="acts">
    <button class="primary" id="compras"><span class="ico">📦</span> Minhas compras salvas</button>
    <button id="exportar"><span class="ico">⬇</span> Exportar novas compras</button>
  </div>
  <div class="atual">
    <div class="atual-linha"><span>Versão instalada</span><b id="versao">—</b></div>
    <button id="procurar"><span class="ico">⟳</span> Procurar atualização</button>
    <button id="aplicar" hidden><span class="ico">⬆</span> <span id="aplicarTxt">Atualizar agora</span></button>
    <div id="statusAtualizacao"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
