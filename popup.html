<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>BetterJamble</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;width:300px;background:#0f0f15;color:#ececf3;font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{padding:14px 16px 12px;border-bottom:1px solid #22222c}
  h1{margin:0;font-size:14px}
  .sub{color:#8b8b9c;font-size:11.5px;margin-top:2px}
  .acts{display:flex;flex-direction:column;gap:8px;padding:14px 16px 16px}
  button{width:100%;padding:9px 12px;border-radius:10px;border:1px solid #26262f;background:#161620;color:#ececf3;
    font:600 12.5px system-ui;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;transition:.15s}
  button:hover{border-color:#3b3b4b;background:#1b1b26}
  button.primary{background:linear-gradient(135deg,#e9e9f0,#c9c9d4);border-color:transparent;color:#101018}
  button.primary:hover{filter:brightness(1.08)}
  .ico{font-size:14px}
</style>
</head>
<body>
  <header>
    <h1>BetterJamble</h1>
    <div class="sub" id="quando">carregando…</div>
  </header>
  <div class="acts">
    <button class="primary" id="compras"><span class="ico">📦</span> Minhas compras salvas</button>
    <button id="exportar"><span class="ico">⬇</span> Exportar novas compras</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
