<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas compras — WiseLive</title>
<style>
  /* Minhas compras — no visual do WiseLive Panel (true-black-flat):
     fundo preto, cards #111 sem borda, botão principal branco invertido. */
  :root{color-scheme:dark;
    --fundo:#000;--card:#111;--dentro:#1a1a1a;--ativo:#222;--regua:#1f1f1f;--controle:#444;
    --texto:#fff;--texto2:#b4b4b4;--texto3:#949494;
    --ui:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--fundo);color:var(--texto);font:400 14px/20px var(--ui);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1400px;margin:0 auto;padding:28px 24px 60px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;padding:0 22px}
  h1{margin:0;font-size:20px;line-height:28px;font-weight:600}
  .sub{color:var(--texto2);font-size:13px;margin-top:2px}
  .btn{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--controle);background:transparent;color:var(--texto);
    font:500 13px var(--ui);cursor:pointer;white-space:nowrap;transition:background .16s}
  .btn:hover{background:var(--ativo)}
  .btn.primary{background:#fff;border-color:#fff;color:#000;font-weight:600}
  .btn.primary:hover{background:#fff}
  /* números do topo: um card só, dividido em colunas por réguas de 1px, rótulo acima do valor */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));row-gap:16px;margin-bottom:14px;
    background:var(--card);border-radius:20px;padding:18px 0}
  .card{display:flex;flex-direction:column;gap:6px;padding:0 22px;border-left:1px solid var(--regua);background:transparent;border-radius:0}
  .card:first-child{border-left:0}
  .card span{color:var(--texto2);font-size:13px;display:block}
  .card span::first-letter{text-transform:uppercase}
  .card b{font-size:24px;line-height:30px;font-weight:500;font-variant-numeric:tabular-nums}
  .filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .filtros input,.filtros select{height:40px;font:inherit;color:var(--texto);background:var(--card);border:1px solid var(--controle);border-radius:999px;
    padding:0 18px;min-width:0;outline:none}
  .filtros input:focus,.filtros select:focus{border-color:var(--texto)}
  .filtros input::placeholder{color:var(--texto3)}
  .filtros input{flex:1 1 260px}
  .tabela{background:var(--card);border:0;border-radius:20px;overflow:auto;max-height:72vh;padding:6px 10px}
  table{border-collapse:collapse;width:100%;min-width:1080px}
  th,td{padding:0 12px;height:48px;text-align:left;border-bottom:1px solid var(--regua);font-size:13.5px;white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}
  th{position:sticky;top:0;height:40px;background:var(--card);color:var(--texto3);font-weight:400;font-size:12.5px;cursor:pointer;user-select:none;z-index:1}
  th:hover{color:var(--texto)}
  tbody tr:hover td{background:var(--dentro)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .prod{white-space:normal;min-width:240px;display:flex;align-items:center;gap:10px}
  .thumb{width:32px;height:32px;border-radius:8px;object-fit:cover;background:var(--ativo);flex:none}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .p-roxo{background:#1b2a36;color:#7cc6f2}.p-ambar{background:#2b2414;color:#e5a93b}
  .p-verde{background:#172a1d;color:#3fc07a}.p-vermelho{background:#2c1a20;color:#e5566f}.p-cinza{background:#222;color:#b4b4b4}
  code{font:12px ui-monospace,Consolas,monospace;background:var(--ativo);padding:3px 8px;border-radius:6px;cursor:copy}
  code.ok{background:#172a1d;color:#3fc07a}
  a{color:var(--texto);font-weight:500;text-decoration:none}
  a:hover{text-decoration:underline}
  .muted{color:var(--texto3)}
  .empty{padding:48px 20px;text-align:center;color:var(--texto2);line-height:1.8;border:1px dashed #333;border-radius:20px}
  .rodape{color:var(--texto3);font-size:12.5px;margin-top:12px;padding:0 22px}
  @media print{body{background:#fff;color:#000}.filtros,.btn,header div:last-child{display:none}.tabela,.cards{max-height:none;background:#fff;border:0}th{background:#fff}}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div><h1>Minhas compras</h1><div class="sub" id="sub">carregando…</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn" id="csv">Baixar CSV</button>
        <button class="btn" id="print">Imprimir / PDF</button>
        <button class="btn primary" id="atualizar">Atualizar</button>
      </div>
    </header>
    <div id="app"></div>
  </div>
  <script src="login-painel.js"></script>
  <script src="compras.js"></script>
</body>
</html>
